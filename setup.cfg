[metadata]
name = customy-data
version = 0.1.0
description = Governed customer data collection SDK for Customy Data
long_description = file: README.md
long_description_content_type = text/markdown
author = Customy
author_email = hello@customy.ai
license = MIT
url = https://customy.ai
project_urls =
    Repository = https://github.com/customyco/customynew/tree/main/packages/sdk-data-python
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src
