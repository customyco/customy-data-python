name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and build
        run: |
          python -m pip install --upgrade build pytest
          pytest -q
          python -c "import os,tomllib; actual=tomllib.load(open('pyproject.toml','rb'))['project']['version']; expected=os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert actual == expected, f'{actual} != {expected}'"
          python -m build
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
